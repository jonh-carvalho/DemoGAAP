<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAAP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1f2937; }
        nav { background: #111827; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-right: 1rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 10px; padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: .75rem; vertical-align: top; }
        .status { font-weight: bold; }
        .alert { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }
        form { display: grid; gap: .75rem; max-width: 420px; }
        input { padding: .7rem; border: 1px solid #d1d5db; border-radius: 8px; }
        button { background: #2563eb; border: none; color: white; padding: .8rem 1rem; border-radius: 8px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        .metric { background: #eff6ff; border-radius: 10px; padding: 1rem; }
        .metric strong { display: block; font-size: 1.5rem; margin-top: .4rem; }
    </style>
</head>
<body>
    <nav>
        <div><strong>GAAP</strong></div>
        <div>
            <a href="/">Home</a>
            <a href="/dashboard/">Dashboard</a>
            <a href="/servicos/">Serviços</a>
            <a href="/agendamentos/">Agendamentos</a>
            <a href="/presencas/">Presenças</a>
            <a href="/login/">Login</a>
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
